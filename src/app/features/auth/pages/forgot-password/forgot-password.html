<section class="min-h-screen bg-[#f3f6fb]">
  <!-- Page Content -->
  <div
    class="min-h-[calc(100vh-72px)] flex flex-col items-center justify-center pt-8 px-4 border-0"
  >
    <!-- Forgot Password Card -->
    <div
      class="w-full max-w-[450px] bg-white rounded-lg shadow-sm border border-slate-100 px-10 py-10 border-0"
    >
      <h1 class="text-[28px] font-semibold text-slate-900 leading-tight">
        Forgot password?
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        No worries, we'll send you reset instructions.
      </p>

      <form class="mt-7">
        <!-- Email -->
        <div>
          <label
            for="email"
            class="block mb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-700"
          >
            Email Address
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            class="
              w-full
              h-11
              px-4
              rounded-sm
              border
              border-[#c9d8f5]
              bg-[#edf3ff]
              text-sm
              text-slate-900
              placeholder:text-slate-400
              outline-none
              transition
              focus:border-blue-500
              focus:ring-2
              focus:ring-blue-100
            "
          />
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="
            mt-5
            w-full
            h-11
            rounded-sm
            bg-[#0866c6]
            text-white
            text-sm
            font-medium
            transition
            hover:bg-[#0759ad]
            focus:outline-none
            focus:ring-4
            focus:ring-blue-100
            cursor-pointer
          "
        >
          Send Reset Link
        </button>

        <!-- Back -->
        <div class="mt-5 text-center">
          <a
            routerLink="/login"
            class="inline-flex items-center gap-1 text-xs font-medium text-[#174a79] hover:underline"
          >
            <span class="text-base leading-none">←</span>
            Back to log in
          </a>
        </div>
      </form>
    </div>

    <!-- Success Message -->
    <div
      class="
        mt-6
        w-full
        max-w-[450px]
        rounded-sm
        bg-[#dcf8ed]
        px-5
        py-4
      "
    >
      <div class="flex items-start gap-3">
        <!-- Success icon -->
        <div
          class="
            mt-[2px]
            flex
            h-5
            w-5
            shrink-0
            items-center
            justify-center
            rounded-full
            bg-emerald-700
            text-white
            text-xs
            font-bold
          "
        >
          ✓
        </div>

        <p class="text-xs leading-5 text-slate-700">
          If an account exists with this email, we've sent a password reset
          link.
        </p>
      </div>

      <div
        class="mt-4 flex items-center justify-between gap-4"
      >
        <span
          class="text-[10px] font-medium uppercase tracking-wide text-slate-500"
        >
          Didn't receive email?
        </span>

        <button
          type="button"
          class="
            text-[10px]
            font-semibold
            uppercase
            tracking-wide
            text-[#174a79]
            cursor-pointer
          "
        >
          Resend in 05:00
        </button>
      </div>
    </div>
  </div>
</section>
