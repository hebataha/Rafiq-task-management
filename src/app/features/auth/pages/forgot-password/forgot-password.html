<section class="min-h-screen bg-[#f8f9fd]">
  <!-- Page Content -->
  <div
    class="flex min-h-screen flex-col items-center justify-center px-4 py-8"
  >
    <!-- Forgot Password Card -->
    <div
      class="w-full max-w-[450px] rounded-[6px] border border-[#edf0f5] bg-white px-6 py-8 shadow-[0_8px_28px_rgba(15,23,42,0.06)] sm:px-10 sm:py-10"
    >
      <h1 class="text-[28px] font-semibold leading-tight text-[#172033]">
        Forgot password?
      </h1>

      <p class="mt-2 text-[13px] text-[#6f7785]">
        No worries, we'll send you reset instructions.
      </p>

      <form class="mt-7">
        <!-- Email -->
        <div>
          <label
            for="email"
            class="mb-2 block text-[11px] font-semibold uppercase tracking-wide text-[#4b5565]"
          >
            Email Address
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            class="
              w-full
              h-11
              px-4
              rounded-[4px]
              border
              border-[#dce5f4]
              bg-[#eaf1ff]
              text-[14px]
              text-[#344054]
              placeholder:text-[#94a0b2]
              outline-none
              transition
              focus:border-[#8aaddd]
              focus:bg-white
            "
          />
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="
            mt-5
            w-full
            h-11
            rounded-[4px]
            bg-[#0866c6]
            text-white
            text-[13px]
            font-semibold
            transition
            hover:bg-[#075caf]
            focus:outline-none
            focus:ring-4
            focus:ring-blue-100
            cursor-pointer
          "
        >
          Send Reset Link
        </button>

        <!-- Back -->
        <div class="mt-5 text-center">
          <a
            routerLink="/login"
            class="inline-flex items-center gap-1 text-[13px] font-medium text-[#0866c6] hover:underline"
          >
            <span class="text-base leading-none">←</span>
            Back to log in
          </a>
        </div>
      </form>
    </div>

    <!-- Success Message -->
    <div
      class="
        mt-6
        w-full
        max-w-[450px]
        rounded-[4px]
        border border-[#d0f0df]
        bg-[#f0fbf5]
        px-5
        py-4
      "
    >
      <div class="flex items-start gap-3">
        <!-- Success icon -->
        <div
          class="
            mt-[2px]
            flex
            h-5
            w-5
            shrink-0
            items-center
            justify-center
            rounded-full
            bg-emerald-700
            text-white
            text-xs
            font-bold
          "
        >
          ✓
        </div>

        <p class="text-[13px] leading-5 text-[#475467]">
          If an account exists with this email, we've sent a password reset
          link.
        </p>
      </div>

      <div
        class="mt-4 flex items-center justify-between gap-4"
      >
        <span
          class="text-[10px] font-medium uppercase tracking-wide text-[#7c8594]"
        >
          Didn't receive email?
        </span>

        <button
          type="button"
          class="
            text-[10px]
            font-semibold
            uppercase
            tracking-wide
            text-[#0866c6]
            cursor-pointer
          "
        >
          Resend in 05:00
        </button>
      </div>
    </div>
  </div>
</section>
