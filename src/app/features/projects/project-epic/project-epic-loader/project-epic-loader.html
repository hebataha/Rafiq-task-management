<div class="min-h-screen animate-pulse bg-[#f8f9fd] px-5 py-6 sm:px-8 lg:px-10">

  <!-- Breadcrumb -->
  <div class="mb-6 flex items-center gap-2">
    <div class="h-2 w-10 rounded-sm bg-[#e5eaf5]"></div>
    <div class="h-2 w-2 rounded-sm bg-[#e5eaf5]"></div>
    <div class="h-2 w-12 rounded-sm bg-[#e5eaf5]"></div>
  </div>

  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">

    <div class="h-7 w-36 rounded-sm bg-[#e8edf8]"></div>

    <div class="flex gap-2">
      <div class="h-10 w-56 rounded-[4px] bg-[#e8edf8]"></div>
      <div class="h-10 w-24 rounded-[4px] bg-[#e8edf8]"></div>
    </div>

  </div>


  <!-- Cards Grid -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:gap-5">

    @for (item of [1,2,3,4,5,6]; track item) {

      <div
        class="relative rounded-[4px] border border-[#edf0f5] bg-white px-5 py-5 shadow-[0_1px_4px_rgba(15,23,42,0.04)] sm:px-6"
      >

        <!-- Top -->
        <div class="flex items-center justify-between">

          <div class="h-5 w-12 rounded-sm bg-[#e9efff]"></div>

          <div class="h-5 w-5 rounded-[5px] bg-[#edf1ff]"></div>

        </div>


        <!-- Title -->
        <div class="mt-4 h-5 w-full rounded-sm bg-[#edf2ff]"></div>


        <!-- Assignee -->
        <div class="mt-5 flex items-center gap-3">

          <!-- Avatar -->
          <div class="h-9 w-9 rounded-full bg-[#edf1ff]"></div>

          <!-- Name -->
          <div class="h-3 w-20 rounded-sm bg-[#edf1ff]"></div>

        </div>


        <!-- Divider -->
        <div class="my-5 h-px w-full bg-[#f0f2fa]"></div>


        <!-- Footer -->
        <div class="flex items-center justify-between">

          <div class="h-3 w-28 rounded-sm bg-[#edf1ff]"></div>

          <div class="h-3 w-20 rounded-sm bg-[#edf1ff]"></div>

        </div>

      </div>

    }

  </div>

</div>
