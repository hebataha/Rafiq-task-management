<div class="min-h-screen bg-[#fbfbff] p-5 animate-pulse">

  <!-- Breadcrumb -->
  <div class="mb-5 flex items-center gap-2">
    <div class="h-2 w-10 rounded-sm bg-[#f0f3ff]"></div>
    <div class="h-2 w-2 rounded-sm bg-[#f0f3ff]"></div>
    <div class="h-2 w-12 rounded-sm bg-[#eef2ff]"></div>
  </div>

  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">

    <div class="h-5 w-32 rounded-sm bg-[#edf2ff]"></div>

    <div class="flex gap-2">
      <div class="h-5 w-16 rounded-sm bg-[#edf2ff]"></div>
      <div class="h-5 w-20 rounded-sm bg-[#edf2ff]"></div>
    </div>

  </div>


  <!-- Cards Grid -->
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">

    @for (item of [1,2,3,4,5,6]; track item) {

      <div
        class="relative rounded-[3px] border border-[#f4f5fb] bg-white px-3 py-3 shadow-[0_2px_8px_rgba(15,23,42,0.02)]"
      >

        <!-- Top -->
        <div class="flex items-center justify-between">

          <div class="h-2 w-10 rounded-sm bg-[#f1f4ff]"></div>

          <div class="h-4 w-4 rounded-[5px] bg-[#edf1ff]"></div>

        </div>


        <!-- Title -->
        <div class="mt-3 h-3 w-full rounded-sm bg-[#edf2ff]"></div>


        <!-- Assignee -->
        <div class="mt-4 flex items-center gap-2">

          <!-- Avatar -->
          <div class="h-4 w-4 rounded-full bg-[#edf1ff]"></div>

          <!-- Name -->
          <div class="h-2 w-16 rounded-sm bg-[#edf1ff]"></div>

        </div>


        <!-- Divider -->
        <div class="my-3 h-px w-full bg-[#f0f2fa]"></div>


        <!-- Footer -->
        <div class="flex items-center justify-between">

          <div class="h-2 w-7 rounded-sm bg-[#edf1ff]"></div>

          <div class="h-2 w-5 rounded-sm bg-[#edf1ff]"></div>

        </div>

      </div>

    }

  </div>

</div>
