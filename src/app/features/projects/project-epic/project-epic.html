<div class="min-h-screen bg-[#f7f9fc] px-6 py-5">

    <!-- Breadcrumb -->
    <app-breadcrumb></app-breadcrumb>

    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-[22px] font-semibold text-[#15233b]">
            Project Epics
        </h1>

        <div class="flex items-center gap-4">

            <!-- Search -->
            <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[12px] text-[#98a4b6]">
                    🔍
                </span>

                <input type="text" placeholder="Search epics..." class="h-10 w-[300px] rounded-[2px] border border-[#e1e8f2] bg-[#eaf1ff]
                 pl-9 pr-3 text-[12px] text-[#26344c]
                 outline-none placeholder:text-[#94a0b2]
                 focus:border-[#b8c9e3]" />
            </div>

            <!-- New Epic Button -->
            <button class="h-10 rounded-[3px] bg-[#0866c6] px-5 text-[12px] font-medium text-white
               shadow-sm transition hover:bg-[#075caf]">
                + New Epic
            </button>
        </div>
    </div>

    <!-- Epics Grid -->
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2">


        <div class="relative rounded-[3px] border border-[#edf0f5] bg-white
               px-5 py-4 shadow-[0_2px_10px_rgba(15,23,42,0.03)]">

            <!-- Left Blue Border -->
            <div class="absolute left-0 top-0 h-full w-[3px] rounded-l-[3px] bg-[#0866c6]">
            </div>

            <!-- Epic Code -->
            <span class="inline-flex rounded-[2px] bg-[#e9f1ff] px-2 py-1
                 text-[9px] font-semibold text-[#2c67b3]">
            </span>

            <!-- Title -->
            <h2 class="mt-3 text-[15px] font-semibold text-[#182840]">
            </h2>

            <!-- Assignee -->
            <div class="mt-4 flex items-center gap-2">

                <div class="flex h-8 w-8 items-center justify-center rounded-full
                   bg-[#0568c8] text-[10px] font-semibold text-white">
                    AM
                </div>

                <div>
                    <p class="text-[9px] text-[#8c97a8]">
                        Assignee
                    </p>

                    <p class="text-[10px] font-medium text-[#27364d]">
                    </p>
                </div>

            </div>

            <!-- Divider -->
            <div class="my-4 h-px bg-[#f0f2f5]"></div>

            <!-- Footer -->
            <div class="flex items-center justify-between text-[9px] text-[#8994a4]">

                <div class="flex items-center gap-1">
                    <span>♧</span>
                    <span>
                        Created by:
                        <span class="text-[#5b6676]">
                        </span>
                    </span>
                </div>

                <div class="flex items-center gap-1">
                    <span>▢</span>
                </div>

            </div>

        </div>


    </div>

</div>
