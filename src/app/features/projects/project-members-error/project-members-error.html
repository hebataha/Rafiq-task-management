<div class="flex min-h-[500px] w-full items-center justify-center">
  <div class="flex flex-col items-center text-center">

    <!-- Error Icon -->
    <div
      class="mb-5 flex h-12 w-12 items-center justify-center rounded-lg bg-red-100"
    >
   <img src="assets/images/icons/error.svg"/>
    </div>

    <!-- Title -->
    <h2 class="mb-2 text-sm font-semibold text-slate-900">
      Something went wrong
    </h2>

    <!-- Description -->
    <p class="mb-6 max-w-[260px] text-xs leading-5 text-slate-500">
      We're having trouble retrieving your project members right now.
      Please try again in a moment.
    </p>

    <!-- Retry Button -->
    <button
      type="button"
      class="rounded-sm bg-blue-600 px-7 py-2.5 text-xs font-medium text-white
             shadow-sm transition hover:bg-blue-700
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      Retry Connection
    </button>

  </div>
</div>
