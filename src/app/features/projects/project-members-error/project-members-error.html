<div class="flex min-h-[min(68vh,640px)] w-full items-center justify-center bg-white px-4 py-12">
  <div class="flex max-w-sm flex-col items-center text-center">

    <!-- Error Icon -->
    <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-red-50">
      <img src="assets/images/icons/error.svg" class="h-6 w-6" />
    </div>

    <!-- Title -->
    <h2 class="mb-2 text-lg font-semibold text-[#12233f]">
      Something went wrong
    </h2>

    <!-- Description -->
    <p class="mb-6 max-w-[300px] text-[13px] leading-5 text-[#6f7785]">
      We're having trouble retrieving your project members right now.
      Please try again in a moment.
    </p>

    <!-- Retry Button -->
    <button type="button" class="rounded-[4px] bg-[#0866c6] px-6 py-3 text-[13px] font-semibold text-white
             shadow-sm transition hover:bg-[#075caf]
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
      Retry Connection
    </button>

  </div>
</div>
