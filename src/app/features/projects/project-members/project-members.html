@if (loading()) {
<app-project-members-loader></app-project-members-loader>
}@else if(errorApi()){
<app-project-members-error></app-project-members-error>

}@else{



<div class="min-h-screen bg-[#f8f9fd] px-5 py-6 sm:px-8 lg:px-10">

    <app-breadcrumb category="PROJECTS" PageName="PR0JECT NAME" subName="MEMBERS"></app-breadcrumb>

    <!-- Header -->
    <div class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-[24px] font-semibold text-[#172033]">
            Project Members
        </h1>

        <button
            class="flex h-10 items-center gap-2 rounded-[4px] bg-[#0866c6] px-5 text-[13px] font-semibold text-white shadow-sm transition hover:bg-[#075caf]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M18 9v6m3-3h-6m-3 4a4 4 0 10-8 0v1h8v-1zm-4-7a4 4 0 100-8 4 4 0 000 8z" />
            </svg>

            Invite Member
        </button>
    </div>
    <div class="mx-auto w-full max-w-3xl overflow-hidden rounded-[4px] border border-[#edf0f5] bg-white shadow-[0_1px_4px_rgba(15,23,42,0.04)]">

        <!-- Table Header -->
        <div class="grid grid-cols-[minmax(0,1fr)_100px] bg-[#f8f9fc] px-4 py-4 sm:grid-cols-[minmax(0,1fr)_140px] sm:px-6">

            <span class="text-[11px] font-semibold uppercase tracking-wide text-[#52627b]">
                Member
            </span>

            <span class="text-[11px] font-semibold uppercase tracking-wide text-[#52627b]">
                Role
            </span>
        </div>

        <!-- Row -->
        <div class="grid grid-cols-[minmax(0,1fr)_100px] items-center border-t border-[#f0f2f5] px-4 py-4 sm:grid-cols-[minmax(0,1fr)_140px] sm:px-6">
            @for (member of memberData; track $index) {
            <div class="flex min-w-0 items-center gap-3 sm:gap-4">
                <div
                    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#e9efff] text-[13px] font-semibold text-[#0866c6]">
                    {{getname(member.metadata.name)}}
                </div>

                <div>
                    <p class="truncate text-[13px] font-semibold text-[#182840]">
                        {{member.metadata.name}}
                    </p>

                    <p class="truncate text-[11px] text-[#8c97a8]">
                        {{member.metadata.email}}
                    </p>
                </div>
            </div>

            <div>
                <span class="role-badge rounded-full px-3 py-1 text-[10px] font-semibold uppercase"
                    [ngClass]="member.role">
                    {{member.role}}
                </span>
            </div>
            }
        </div>

    </div>
</div>

}
<!-- Members Card -->
