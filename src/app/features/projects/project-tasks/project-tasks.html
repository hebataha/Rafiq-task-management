
<section class="min-h-screen bg-[#F8F9FD] px-4 py-6 sm:px-6 lg:px-8">

  <!-- Breadcrumb -->
  <div class="mb-5 flex items-center gap-2 text-[10px] font-medium uppercase tracking-[1px] text-[#98A2B3]">
    <span>Projects</span>
    <span>›</span>
    <span>Rafiq</span>
    <span>›</span>
    <span class="text-[#344054]">Tasks</span>
  </div>

  <!-- Page Header -->
  <div class="mb-7 flex flex-wrap items-center justify-between gap-4">

    <div>
      <h1 class="text-[24px] font-semibold tracking-tight text-[#101828]">
        Active Workboard
      </h1>

      <p class="mt-1 text-[12px] text-[#98A2B3]">
        Curating Project Alpha's production pipeline and milestones.
      </p>
    </div>

    <!-- Search -->
    <div class="relative w-full sm:w-[260px]">
      <svg
        class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[#98A2B3]"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        viewBox="0 0 24 24"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        type="text"
        placeholder="Search tasks..."
        class="h-10 w-full rounded-[4px] border border-[#DCE5F5] bg-[#E8EFFF] pl-10 pr-4 text-[12px] text-[#344054] outline-none placeholder:text-[#98A2B3] focus:border-[#84ADFF]"
      />
    </div>
  </div>

  <!-- Board Horizontal Scroll -->
  <div class="w-full overflow-x-auto pb-4">

    <div class="flex min-w-max items-start gap-4">

      @for (column of columns; track column.status) {

      <!-- Status Column -->
      <div class="w-[285px] shrink-0">

        <!-- Column Header -->
        <div class="mb-4 flex items-center gap-2 px-1">

          <span
            class="h-[7px] w-[7px] rounded-full"
            [style.backgroundColor]="column.color"
          ></span>

          <h2 class="text-[11px] font-semibold uppercase tracking-[1px] text-[#475467]">
            {{ column.status }}
          </h2>

          <span
            class="flex h-[18px] min-w-[18px] items-center justify-center rounded-[3px] px-1 text-[10px] font-semibold"
            [style.backgroundColor]="column.badgeBg"
            [style.color]="column.color"
          >
            0
          </span>
        </div>

        <!-- Add Task -->
        <button
          type="button"
          class="mb-3 flex h-[48px] w-full items-center justify-center gap-2 rounded-[4px] border border-dashed border-[#DDE3ED] bg-transparent text-[10px] font-medium uppercase tracking-[1px] text-[#667085] transition-colors hover:border-[#98A2B3] hover:bg-white"
        >
          <svg
            class="h-[15px] w-[15px]"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v8M8 12h8"></path>
          </svg>

          Add New Task
        </button>

        <!-- Column Body -->
        <div
          class="flex min-h-[540px] flex-col rounded-[4px] border border-[#F0F2F7] bg-[#FAFBFE] p-3"
        >

          <!-- Empty State -->
          <div class="flex flex-1 flex-col items-center justify-center gap-2">

            <svg
              class="h-8 w-8 text-[#94A3B8]"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <rect x="4" y="6" width="16" height="15" rx="2"></rect>
              <path d="M8 3v6M16 3v6M4 11h16"></path>
              <path d="m10 15 4 4m0-4-4 4"></path>
            </svg>

            <p class="text-[10px] font-semibold uppercase tracking-[1.5px] text-[#98A2B3]">
              No Tasks
            </p>
          </div>

        </div>
      </div>

      }
    </div>
  </div>

</section>
