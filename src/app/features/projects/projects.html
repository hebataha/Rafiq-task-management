<div class="min-h-screen bg-[#f7f8fc] px-6 py-6">

  <!-- Header -->
  <div class="mb-5 flex items-start justify-between">
    <div>
      <h1 class="text-[22px] font-semibold text-[#172033]">
        Projects
      </h1>
      <p class="mt-1 text-[11px] text-[#8b94a5]">
        Manage and curate your projects
      </p>
    </div>

    <button type="button" routerLink="add-project"
      class="rounded-[2px] bg-[#0b63ce] px-5 py-2.5 text-[14px] font-medium text-white shadow-sm transition hover:bg-[#0958b8]">
      Create New Project
    </button>
  </div>

  <!-- Projects Grid -->
@if (loading()) {
  <div role="status" class="flex items-center justify-center loading">
    <svg aria-hidden="true" class="w-8 h-8 animate-spin text-[#c3c6d6] fill-[#003d9b]" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
      <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
    </svg>
    <span class="sr-only">Loading...</span>
  </div>
} @else {
 <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (item of dataResult(); track $index) {
    <!-- Project Card -->
    <div
      class="card-data rounded-[3px] border border-[#eef0f4] bg-white px-4 py-4 shadow-[0_1px_4px_rgba(15,23,42,0.03)]">
      <h2 class="text-[16px] font-semibold text-[#222d3d]">
        {{item.name ? item.name : "title"}}
      </h2>

      <p class="mt-2 line-clamp-3 text-[14px] leading-[1.6] text-[#737d8c]">
        {{item.description}}


      </p>

      <!-- Stats -->
      <div class="mt-4 flex items-center gap-5 text-[10px] text-[#1d4f8f]">

        <div class="flex items-center gap-1">
          <img src="assets/images/icons/epic_blue.svg" />
          <span>8 Epics</span>
        </div>

        <div class="flex items-center gap-1">
          <img src="assets/images/icons/tasks_blue.svg" />

          <span>14 Tasks</span>
        </div>

        <div class="flex items-center gap-1">
          <img src="assets/images/icons/members_blue.svg" />

          <span>8 Members</span>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-4 flex items-center justify-between border-t border-[#f0f1f3] pt-3">
        <span class="text-[11px] uppercase tracking-wide text-[#9aa2af]">
          Created At
        </span>

        <span class="text-[14px] text-[#434654]">
          {{ item.created_at | date:'dd/MM/yyyy' }}

        </span>
      </div>
    </div>
    }

    <button type="button" routerLink="add-project"
      class="flex min-h-[175px] flex-col items-center justify-center rounded-[3px] border border-dashed border-[#e4e7ec] bg-white text-[#475467] transition hover:border-[#9db9e7] hover:bg-[#f9fbff]">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#f3f6fb] text-[#315986]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" />
          <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </div>
      <span class="mt-3 text-[14px] font-semibold uppercase tracking-[0.08em]">
        Add Project
      </span>
    </button>
  </div>
}

  
  <!-- Pagination -->
  <div class="mt-14 flex justify-end">

    <div class="flex items-center gap-1 text-[10px]">

      <button
        class="flex h-7 w-7 items-center justify-center rounded-[2px] border border-[#edf0f3] bg-white text-[#a2a9b3]">
        ‹
      </button>

      <button class="flex h-7 w-7 items-center justify-center rounded-[2px] bg-[#0b63ce] font-medium text-white">
        1
      </button>

      <button class="flex h-7 w-7 items-center justify-center rounded-[2px] bg-white text-[#626c7a]">
        2
      </button>

      <button class="flex h-7 w-7 items-center justify-center rounded-[2px] bg-white text-[#626c7a]">
        3
      </button>

      <span class="px-1 text-[#9aa2af]">
        ...
      </span>

      <button class="flex h-7 w-7 items-center justify-center rounded-[2px] bg-white text-[#626c7a]">
        15
      </button>

      <button
        class="flex h-7 w-7 items-center justify-center rounded-[2px] border border-[#edf0f3] bg-white text-[#7b8492]">
        ›
      </button>

    </div>

  </div>

</div>
