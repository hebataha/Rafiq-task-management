<div class="mb-2 flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.08em] mb-10 ">

    @for (item of items; track $index ; let last = $last) {
    <span [class.text-primary]="last" [class.text-slate-400]="!last">
        {{ item }}
    </span>
    @if(!last){
    <img src="assets/images/icons/breadcrumb-arrow.svg" />

    }

    }


</div>
