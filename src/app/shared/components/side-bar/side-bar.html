<aside class="bg-surface-low flex flex-col justify-between" [class.textCollapse]="textCollapse">
    <div class="navigation-list">

        <main class="navigation-list__logo flex items-center">
         <img [src]="textCollapse ?'assets/images/logo-icon.svg' : 'assets/images/Logo.svg'  " />
            
        </main>

        <ul class="nav-list list-none flex flex-col gap-2">
            <li>
                <a class="nav-list__item flex gap-2 p-2 items-center" routerLink="/projects">
                    <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H8L10 2H18C18.55 2 19.0208 2.19583 19.4125 2.5875C19.8042 2.97917 20 3.45 20 4H9.175L7.175 2H2V14L4.4 6H21.5L18.925 14.575C18.7917 15.0083 18.5458 15.3542 18.1875 15.6125C17.8292 15.8708 17.4333 16 17 16H2ZM4.1 14H17L18.8 8H5.9L4.1 14ZM4.1 14L5.9 8L4.1 14ZM2 4V2V4Z" />
                    </svg>
                    <span class="nav-list__item--name">projects</span>


                </a>
            </li>
            <li>
                <a class="nav-list__item flex gap-2 p-2 items-center">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="16" height="16" fill="white" fill-opacity="0.01" />
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12.2667 1.06665C12.5612 1.06665 12.8 1.30543 12.8 1.59998V14.4C12.8 14.6945 12.5612 14.9333 12.2667 14.9333C11.9721 14.9333 11.7333 14.6945 11.7333 14.4V1.59998C11.7333 1.30543 11.9721 1.06665 12.2667 1.06665ZM10.1333 3.19998C10.4279 3.19998 10.6667 3.43877 10.6667 3.73332V14.4C10.6667 14.6945 10.4279 14.9333 10.1333 14.9333C9.83877 14.9333 9.59998 14.6945 9.59998 14.4V3.73332C9.59998 3.43877 9.83877 3.19998 10.1333 3.19998ZM14.4 3.19998C14.6945 3.19998 14.9333 3.43877 14.9333 3.73332V14.4C14.9333 14.6945 14.6945 14.9333 14.4 14.9333C14.1055 14.9333 13.8667 14.6945 13.8667 14.4V3.73332C13.8667 3.43877 14.1055 3.19998 14.4 3.19998ZM5.86665 4.26665C6.1612 4.26665 6.39998 4.50543 6.39998 4.79998V14.4C6.39998 14.6945 6.1612 14.9333 5.86665 14.9333C5.5721 14.9333 5.33332 14.6945 5.33332 14.4V4.79998C5.33332 4.50543 5.5721 4.26665 5.86665 4.26665ZM1.59998 5.33332C1.89453 5.33332 2.13332 5.5721 2.13332 5.86665V14.4C2.13332 14.6945 1.89453 14.9333 1.59998 14.9333C1.30543 14.9333 1.06665 14.6945 1.06665 14.4V5.86665C1.06665 5.5721 1.30543 5.33332 1.59998 5.33332ZM7.99998 5.33332C8.29453 5.33332 8.53332 5.5721 8.53332 5.86665V14.4C8.53332 14.6945 8.29453 14.9333 7.99998 14.9333C7.70543 14.9333 7.46665 14.6945 7.46665 14.4V5.86665C7.46665 5.5721 7.70543 5.33332 7.99998 5.33332ZM3.73332 7.46665C4.02787 7.46665 4.26665 7.70543 4.26665 7.99998V14.4C4.26665 14.6945 4.02787 14.9333 3.73332 14.9333C3.43877 14.9333 3.19998 14.6945 3.19998 14.4V7.99998C3.19998 7.70543 3.43877 7.46665 3.73332 7.46665Z" />
                    </svg>
                    <span class="nav-list__item--name">My Statistics</span>
                </a>
            </li>
        </ul>
        <div class="nav-list_dropdown">
            <ul class="nav-list_dropdown__item ">
                <li class=" cursor-pointer relative">
                    <a class="nav-list_dropdown__item--child flex gap-2 p-2 items-center justify-between"
                        (click)="toggle()">
                        <img src="assets/images/icons/single-folder.svg" />

                        <div class="text">
                            <span>Active Project Nation</span>

                        </div>
                        <div class="arrow">
                            <img
                                [src]="isExpanded ?'assets/images/icons/top-arrow.svg' :'assets/images/icons/down-arrow.svg'" />

                        </div>
                    </a>
                    @if(isExpanded){
                    <div class="nav-list_dropdown__item--submenu flex flex-col gap-3 bg-white">
                        <div class="topic flex gap-2 p-2 items-center">
                            <img src="assets/images/icons/epic.svg" />
                            <span>Epics</span>
                        </div>
                        <div class="topic flex gap-2 p-2 items-center">
                            <img src="assets/images/icons/tasks.svg" />
                            <span>tasks</span>
                        </div>
                        <div class="topic flex gap-2 p-2 items-center">
                            <img src="assets/images/icons/members.svg" />
                            <span>Members</span>
                        </div>
                        <div class="topic flex gap-2 p-2 items-center">
                            <img src="assets/images/icons/details.svg" />
                            <span>Details</span>
                        </div>

                    </div>
                    }


                </li>
                <li>
                    <a class="nav-list_dropdown__item--child"></a>
                </li>
                <li>
                    <a class="nav-list_dropdown__item--child"></a>
                </li>

            </ul>
        </div>
    </div>
    <div class="navigation-actions">
        <ul class="list-none navigation-actions__list flex flex-col gap-2">
            <li class="list-none navigation-actions__list--item">
                <a class="flex gap-2 p-2 items-center cursor-pointer collapsed" (click)="sidebarCollapse()">
                    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 20L0 10L10 0L11.775 1.775L3.55 10L11.775 18.225L10 20Z" fill="#041B3C" />
                    </svg>
                    <span>Collapse</span>
                </a>

            </li>
            <li class="list-none navigation-actions__list--item">
                <a class="flex gap-2 p-2 items-center logout cursor-pointer" [class.disabled]="loadingState"  (click)="logout()">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M2 18C1.45 18 0.979167 17.8042 0.5875 17.4125C0.195833 17.0208 0 16.55 0 16V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H9V2H2V16H9V18H2ZM13 14L11.625 12.55L14.175 10H6V8H14.175L11.625 5.45L13 4L18 9L13 14Z"
                            fill="#BA1A1A" />
                    </svg>
                    <span>Logout</span>
                </a>
            </li>
        </ul>

    </div>
</aside>
