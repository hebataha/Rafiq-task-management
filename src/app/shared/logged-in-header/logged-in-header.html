<header class="main-header p-3">
    <section class="user flex gap-2 justify-end align-center">
        @if (loading) {
        <div class="animate-pulse flex gap-2 items-center">
            <div class="w-24 h-4 bg-gray-200 rounded"></div>
            <div class="w-10 h-10 bg-gray-200 rounded-full"></div>
        </div>
        }
        @if(userData){
        <div class="user__info">
            <p class="user__info--name">{{userData?.name}}</p>
            <p class="user__info--description">{{userData?.department}}</p>
        </div>
        <div class="user__avtar">
            <span>{{getname(userData?.name)}}</span>

        </div>
        }


    </section>
</header>
